plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // 第三方 Mixin mod（Jade / Placebo / Apothic Attributes / Dummmmmmy 等）在开发环境运行时，
            // 需要把其生产 jar 里的 refmap 从 SRG 名重映射到当前开发映射，否则会报
            // "mixin injection point / target method not found" 类注入失败。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin AP 需要「official → SRG」映射才能把 @Inject 目标方法写进 refmap（生产 jar reobf 后用 SRG 名）。
// Mixin 0.8.5 内置的 TSRG 解析器不认 FG6 产出的 TSRG2，这里把 createMcpToSrg/output.tsrg
// 转成经典 SRG 格式（CL:/FD:/MD:），通过 -AreobfSrgFile 喂给默认 searge 混淆服务。
def reobfSrgFile = layout.buildDirectory.file('mimi-ap/reobf.srg')
tasks.register('generateReobfSrg') {
    dependsOn 'createMcpToSrg'
    outputs.file(reobfSrgFile)
    doLast {
        def input = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        def sb = new StringBuilder()
        String curLeft = null
        String curRight = null
        input.eachLine('UTF-8') { line ->
            if (line.startsWith('tsrg2')) {
                return
            }
            if (line.startsWith('\t')) {
                if (line.startsWith('\t\t')) {
                    return // 参数/static 等修饰行，忽略
                }
                def p = line.trim().split(' ')
                if (p.length == 2) {
                    sb << "FD: ${curLeft}/${p[0]} ${curRight}/${p[1]}\n"
                } else if (p.length >= 3) {
                    sb << "MD: ${curLeft}/${p[0]} ${p[1]} ${curRight}/${p[2]} ${p[1]}\n"
                }
            } else {
                def p = line.split(' ')
                curLeft = p[0]
                curRight = p[1]
                sb << "CL: ${curLeft} ${curRight}\n"
            }
        }
        def out = reobfSrgFile.get().asFile
        out.parentFile.mkdirs()
        out.setText(sb.toString(), 'UTF-8')
    }
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn 'generateReobfSrg', 'processResources'
    // Mixin AP 与 Gradle 增量编译不兼容：增量重编时会重复创建 refmap 资源，
    // 抛 FilerException "Attempt to reopen a file for path ...mimiworld.refmap.json"，必须关闭
    options.incremental = false
    // Mixin AP 通过 CLASS_PATH 扫描 *.mixins.json 才能写出 refmap，需把已处理资源目录放进编译类路径
    classpath += files(layout.buildDirectory.dir('resources/main'))
    options.compilerArgs += [
            "-AreobfSrgFile=${reobfSrgFile.get().asFile.absolutePath}",
            // ReferenceManager.write() 未配置输出名时直接 return（0.8.5 字节码已核实），必须显式指定；
            // Mixin AP 的 Injection/Targets 两个处理器在最终轮各写一次同名文件，第二次必然抛
            // FilerException，被 AP 自身吞掉仅打印栈，真正致命的是「输出目录里已有旧 refmap」
            "-AoutRefMapFile=mimiworld.refmap.json"
    ]
    // 因此每轮编译前删除旧 refmap，消除 JavacFiler「文件已存在」致命冲突；
    // 同轮内第二次写入仍会被 AP 捕获打印栈但不影响构建（上游 Mixin 0.8.5 固有行为）
    doFirst {
        delete layout.buildDirectory.file('classes/java/main/mimiworld.refmap.json').get().asFile
    }
}

// BMCLAPI mirror for game assets, since resources.download.minecraft.net is
// unreachable on some networks. The path layout is identical to the official source.
tasks.withType(net.minecraftforge.gradle.common.tasks.DownloadAssets).configureEach {
    assetRepository = 'https://bmclapi2.bangbang93.com/assets/'
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // JEI maven repositories
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    // CurseMaven：以 CurseForge 文件 ID 引入任意 mod（fg.deobf 会正确重映射 mixin refmap，
    // 不要用 flatDir 本地 jar 引入带 mixin 的 mod —— flatDir 无 POM 元数据，dev 下 refmap 重映射会失败）
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Illusive Soulworks maven：Curios API
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    // GeckoLib 官方 maven（Cloudsmith）：自定义生物/方块/物品/立体盔甲动画库前置
    // 官方安装文档要求同时放行 geckolib 与 mclib 两个 group（1.20.1 属 1.19.3~1.20.4 模板）
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin 注解处理器：编译期校验 @Inject 目标、生成 mimiworld.refmap.json
    // （版本必须与 Forge 内置 Mixin 一致；Gradle 不会从 compile classpath 自动发现 AP）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI - compile against the JEI API but do not include it at runtime
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // at runtime, use the full JEI jar for Forge
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // === 一同测试的第三方 mod（全部 1.20.1 Forge，前置链已核对） ===
    // Curios API - 饰品/装备槽 API：编译期只依赖 api，运行期用完整 jar
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // GeckoLib - 自定义生物/立体盔甲等 3D 动画库，硬性前置（编译期+运行期都需要完整 jar）
    // 1.20.1 官方依赖模板（1.19.3~1.20.4）：forge 构件走 fg.deobf，另需 mclib:20 数学库
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${geckolib_version}")
    implementation "com.eliotlash.mclib:mclib:20"

    // Jade 11.13.2 - HUD 信息显示（无前置）
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    // 仅编译期引用 Jade 类做可选兼容 mixin（运行时仍由上面的 runtimeOnly 提供）
    compileOnly fg.deobf("curse.maven:jade-324717:6855440")
    // Moonlight Lib 2.16.34 - 通用前置库，Dummmmmmy 必需
    runtimeOnly fg.deobf("curse.maven:moonlight-499980:8261419")
    // Dummmmmmy 2.0.6 - 训练假人（前置 Moonlight）
    runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:6237015")
    // Placebo 8.6.3 - Apothic Attributes 必需前置（无其他前置）
    runtimeOnly fg.deobf("curse.maven:placebo-283644:6274231")
    // Apothic Attributes 1.3.7 - 属性扩展（前置 Placebo，仅测试环境）
    runtimeOnly fg.deobf("curse.maven:apothic-attributes-898963:5634071")

    // Xaero's Minimap 26.5.0（1.20.1 Forge）/ Xaero's World Map 1.46.0（1.20.1 Forge）
    // 纯客户端模组，仅兼容性测试用；世界地图可与小地图联动
    runtimeOnly fg.deobf("curse.maven:xaeros-minimap-263420:8849836")
    runtimeOnly fg.deobf("curse.maven:xaeros-world-map-317780:8849965")

    // Puzzles Lib 8.1.36（1.20.1 Forge）- Fuzs 系列 mod 的库前置（无其他前置）
    runtimeOnly fg.deobf("curse.maven:puzzles-lib-495476:9130247")
    // Overflowing Bars 8.0.1（1.20.1 Forge，纯客户端，前置 Puzzles Lib）
    // 生命/护甲/护甲韧性条超出原版上限时紧凑扩展显示，仅兼容性测试用
    runtimeOnly fg.deobf("curse.maven:overflowing-bars-852662:5763974")

    // Advanced Core Info 1.5.0（1.20.1 Forge，无其他前置）- Advanced Loot Info 的硬性前置
    runtimeOnly fg.deobf("curse.maven:advanced-core-info-1661923:9208458")
    // Advanced Loot Info 2.5.0（1.20.1 Forge，前置 ACI）- JEI/EMI/REI 战利品表信息展示插件
    // 本环境使用已引入的 JEI，仅兼容性测试用
    runtimeOnly fg.deobf("curse.maven:advanced-loot-info-1205426:9208463")

    // Inventory HUD+ 3.4.26（1.20.1 Forge，纯客户端，Curios 展示为可选依赖）
    // HUD 显示装备耐久/背包信息，仅兼容性测试用
    runtimeOnly fg.deobf("curse.maven:inventory-hud-forge-357540:5639966")

    // Cloth Config API 11.1.136（1.20.1 Forge，无前置）
    // 配置界面 GUI 库：compileOnly 供界面代码编译，运行时按可选依赖处理
    // （ConfigScreenRegistrar 用 ModList 判断，未安装时不注册「配置」按钮，mod 照常运行）
    compileOnly fg.deobf("curse.maven:cloth-config-348521:5729105")
    runtimeOnly fg.deobf("curse.maven:cloth-config-348521:5729105")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8' // mods.toml is read as UTF-8 by Forge, and mod_name/mod_description contain non-ASCII text
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // 开发环境（runClient/runServer/IDE 运行）本 mod 以展开目录 build/resources/main 形式加载，
    // Mixin 只会从 META-INF/MANIFEST.MF 的 MixinConfigs 属性发现配置（已对 mixin 0.8.5 字节码核实：
    // MainAttributes.getDirAttributes 只读该文件，不存在则静默没有任何 mixin 配置）。
    // 生产 jar 的同名属性由下方 jar.manifest 提供，与这里无关。
    doLast {
        def metaInfDir = new File(destinationDir, 'META-INF')
        metaInfDir.mkdirs()
        new File(metaInfDir, 'MANIFEST.MF').setText(
                'Manifest-Version: 1.0\r\nMixinConfigs: mimiworld.mixins.json\r\n\r\n',
                'UTF-8')
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // 开发用 MANIFEST.MF 由 processResources 生成进资源目录；打包时排除它，
    // MANIFEST.MF 一律以本任务 manifest {} 块生成的为准（避免重复条目）
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 生产 jar 中声明 Mixin 配置（开发环境由 FML 自动扫描 *.mixins.json）
                'MixinConfigs'            : 'mimiworld.mixins.json'
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
